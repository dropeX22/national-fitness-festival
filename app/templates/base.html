<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}National Fitness Festival{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🏋️ National Fitness Festival</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="/registro">Inscribirse</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block contenido %}{% endblock %}
  </main>

<footer class="text-center text-muted py-4 small">
    National Fitness Festival &copy; 2026 — Sistema de inscripciones
    · <a href="/privacidad">Política de Privacidad</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
